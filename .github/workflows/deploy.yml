name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  # Required so the job can ask GitHub for an OIDC token to hand to AWS.
  id-token: write
  contents: read

# A CloudFormation stack only accepts one update at a time, so never let two
# deploys of the same stage run together.
concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Serverless Framework
        run: npm ci

      - name: Check the Python handlers compile
        run: python -m compileall -q src

      - name: Get temporary AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy
        run: npx serverless deploy --stage ${{ inputs.stage || 'dev' }}
        env:
          # Serverless Framework v4 refuses to run without a licence key.
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          # Only read on the prod stage, where CORS must name a real origin.
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
